name: Java CI and SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  unit-tests:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile application and tests
        run: javac -d build/classes src/SimpleCalculator.java tests/SimpleCalculatorTest.java

      - name: Run unit tests
        run: java -ea -cp build/classes SimpleCalculatorTest

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Java source for analysis
        run: javac -d build/classes src/SimpleCalculator.java

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
